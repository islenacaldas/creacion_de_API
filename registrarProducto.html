<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar producto</title>
</head>

<body>
    <h1>Registrar producto</h1>

    <!-- Envía los datos a registrarProducto.php mediante el método POST -->
    <form action="registrarProducto.php" method="post">

        <!-- Campo para el identificador del producto
        <div class="campo">
            <label for="ide">Id del producto</label>
            <input type="number" id="ide" name="ide" min="1" required>
        </div>
        esto se comenta por que el id del producto la base de datos lo genera automaticamente 
         Campo para el nombre del producto -->
        <div class="campo">
            <label for="nom">Nombre</label>
            <input type="text" id="nom" name="nom" required>
        </div>

        <!-- Campo para la descripción del producto -->
        <div class="campo">
            <label for="descr">Descripción</label>
            <textarea id="descr" name="descr" required></textarea>
        </div>

        <!-- Campo para el precio del producto -->
        <div class="campo">
            <label for="precio">Precio</label>
            <input type="number" id="precio" name="precio" step="0.01" min="0" required>
        </div>

        <!-- Campo para la cantidad disponible -->
        <div class="campo">
            <label for="stock">Stock</label>
            <input type="number" id="stock" name="stock" min="0" required>
        </div>

        <!-- Botón que envía el formulario -->
        <button type="submit">Registrar producto</button>
    </form>
</body>
</html>
