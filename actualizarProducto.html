<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualizar producto</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <div class="contenedor">
    <h2>Actualizar producto</h2>
    <p class="subtitulo">Busca el producto que deseas modificar</p>

    <form action="formularioEdicionProducto.php" method="GET">
      <div class="campo">
        <label for="id">Ingrese el ID del producto:</label>
        <input
          type="number"
          id="id"
          name="id"
          required
          min="1"
          placeholder="Ej: 1"
        >
      </div>

      <button type="submit">Buscar y editar</button>
    </form>
  </div>

</body>
</html>
